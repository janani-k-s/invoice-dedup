<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Invoice Dedup{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --emerald: #064E4B;
    --emerald-hover: #053E3C;
    --champagne: #F8E7C9;
    --champagne-soft: #FBF3E4;
    --bg: #FDFAF4;
    --surface: #FFFFFF;
    --ink: #16241F;
    --gray: #6B7A73;
    --line: #EDE2C9;

    --green: #16A34A;
    --green-tint: #E7F6EC;
    --amber: #C77D18;
    --amber-tint: #FBF0DE;
    --red: #B3261E;
    --red-tint: #FBEAE8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Manrope', sans-serif;
    display: flex;
  }
  .sidebar {
    width: 216px;
    background: var(--emerald);
    color: #CDE4E1;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-brand {
    display: flex; align-items: center; gap: 0.55rem;
    padding: 1rem 1.1rem; border-bottom: 1px solid #0E5F5B;
  }
  .brand-mark {
    width: 26px; height: 26px; background: var(--champagne); border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: var(--emerald); font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 0.82rem;
  }
  .brand-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 0.92rem; color: #fff; }
  .nav { flex: 1; padding: 0.8rem 0.6rem; display: flex; flex-direction: column; gap: 0.15rem; }
  .nav-item {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.5rem 0.7rem; border-radius: 6px;
    font-size: 0.82rem; color: #9FC2BD; cursor: pointer;
    text-decoration: none;
  }
  .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.6; }
  .nav-item:hover { background: #0A5B57; color: #fff; }
  .nav-item.active { background: var(--champagne); color: var(--emerald); font-weight: 700; }
  .nav-item.active .dot { background: var(--emerald); opacity: 1; }
  .nav-section-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.04em; color: #5E9691; padding: 0.9rem 0.7rem 0.3rem; }
  .sidebar-foot { padding: 0.8rem 1.1rem; border-top: 1px solid #0E5F5B; display: flex; align-items: center; gap: 0.55rem; }
  .avatar {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--champagne); color: var(--emerald);
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 0.68rem;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .sidebar-foot .name { font-size: 0.78rem; color: #CDE4E1; }
  .logout-btn {
    background: none; border: none; color: #9FC2BD; font-size: 0.76rem;
    cursor: pointer; text-decoration: underline; padding: 0; margin-left: auto;
  }

  .main-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.7rem 1.6rem; background: var(--surface);
    border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .breadcrumb { font-size: 0.82rem; color: var(--gray); }
  .breadcrumb b { color: var(--ink); }

  .btn {
    font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 0.85rem;
    padding: 0.55rem 1.2rem; border-radius: 8px; border: none;
    background: var(--emerald); color: #fff; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem;
  }
  .btn:hover { background: var(--emerald-hover); }
  .btn-outline {
    background: transparent; color: var(--emerald); border: 1.5px solid var(--emerald);
  }
  .btn-outline:hover { background: var(--champagne-soft); }

  main { flex: 1; overflow-y: auto; padding: 1.6rem 2rem 2.5rem; }

  .chip {
    display: inline-flex; align-items: center; gap: 0.35rem;
    font-weight: 700; font-size: 0.72rem;
    padding: 0.28rem 0.6rem; border-radius: 999px;
  }
  .chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .chip-new { background: var(--green-tint); color: var(--green); }
  .chip-review { background: var(--amber-tint); color: var(--amber); }
  .chip-duplicate { background: var(--red-tint); color: var(--red); }

  {% block extra_style %}{% endblock %}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-mark">I</div>
    <div class="brand-name">Invoice Dedup</div>
  </div>
  <div class="nav">
    <div class="nav-section-label">WORKSPACE</div>
    <a href="{% url 'upload_invoice' %}" class="nav-item {% if request.resolver_match.url_name == 'upload_invoice' %}active{% endif %}">
      <span class="dot"></span> Upload
    </a>
    <a href="{% url 'all_invoices' %}" class="nav-item {% if request.resolver_match.url_name == 'all_invoices' %}active{% endif %}">
      <span class="dot"></span> All Invoices
    </a>
    {% if user.is_staff %}
    <a href="{% url 'review_queue' %}" class="nav-item {% if request.resolver_match.url_name == 'review_queue' %}active{% endif %}">
      <span class="dot"></span> Review Queue
    </a>
    {% endif %}
  </div>
  <div class="sidebar-foot">
    <div class="avatar">{{ user.username|slice:":2"|upper }}</div>
    <div class="name">{{ user.username }}</div>
    <form method="post" action="{% url 'logout' %}" style="margin-left:auto;">
      {% csrf_token %}
      <button type="submit" class="logout-btn">Log out</button>
    </form>
  </div>
</div>

<div class="main-col">
  <div class="topbar">
    <div class="breadcrumb">{% block breadcrumb %}{% endblock %}</div>
    <div>{% block topbar_actions %}{% endblock %}</div>
  </div>
  <main>
    {% block content %}{% endblock %}
  </main>
</div>

</body>
</html>
